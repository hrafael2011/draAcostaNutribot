# Solo PostgreSQL — el resto corre nativo (venv + npm).
#
# Uso:
#   docker compose up -d db
#
# Persistencia: el volumen `pgdata` guarda PostgreSQL entre reinicios.
# NO uses `docker compose down -v` si quieres conservar los datos.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: diet_agent
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d diet_agent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
